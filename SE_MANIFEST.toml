# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_version = "0.5.0"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "se-theory-transformation"
class = "theory"
kind = "foundation"
status = "active"
since = "2026"
summary = "Lean 4 formalization of foundational transformation operators, families, kinds, composition, and orthogonality."

# === Layer Position ===

[layer]
space = "formal-theory"
role = "foundational-transformation-theory"

# === Dependency Declarations ===

[depends]
required = []
optional = []

# === Provided Artifacts ===

[provides]
# Logical artifacts exposed by this repository.
# These are stable identifiers, not file paths.
artifacts = [
  "lean-library",
  "operator-registry",
  "transformation-catalog",
  "transformation-family-registry",
  "composition-registry",
  "orthogonality-matrix",
  "transformation-schemas",
]

# === Scope ===

[scope]
includes = [
  "foundational transformation operators",
  "transformation family definitions",
  "transformation kind definitions",
  "operator-to-family mappings",
  "family-to-kind mappings",
  "operator composition relations",
  "operator orthogonality relations",
  "machine-readable transformation registries",
  "Lean formalization of transformation vocabulary",
]

excludes = [
  "persistence semantics",
  "operational policy",
  "domain-specific interpretation",
  "runtime behavior",
]

# === Validation ===

[validation]
# Validates repository declaration, manifest schema conformance,
# reference artifacts, generated artifacts, and Lean public surface coverage.
entrypoint = "uv run se-validate"
export_check_entrypoint = "uv run se-ref-export --check"
reference_entrypoint = "uv run se-ref-validate"
strict_entrypoint = "uv run se-ref-validate --strict"


# === Behavior / governance ===

[naming]
pattern = "se-theory-*"

[governance]
authority = "structural-explainability"

# === External references ===

[citation]
cff = "CITATION.cff"
preferred = "CITATION.cff"

[traceability]
identifier_map = "reference/index.toml"
