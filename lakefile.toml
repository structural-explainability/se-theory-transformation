# ============================================================
# lakefile.toml
# ============================================================
# Declares the public Lean package identity, import surface,
# build targets, dependencies, and internal test library.

# Run with:
# lake build
# lake test
# lake lint

# ============================================================
# PROJECT IDENTITY
# ============================================================

name = "se-theory-transformation"
version = "0.5.0"
license = "MIT"

# ============================================================
# BUILD SURFACE
# ============================================================
# defaultTargets must include the public Lean library root.

defaultTargets = ["SE.Transformation"]
testDriver = "SETest"
lintDriver = "SELint"

# ============================================================
# LEAN OPTIONS
# ============================================================

[leanOptions]
weak.linter.mathlibStandardSet = true
weak.linter.flexible = true
weak.linter.style.header = false
weak.linter.style.longLine = false

# These linters are included in Mathlib's standard set.
weak.linter.pythonStyle = false
weak.linter.checkInitImports = false
weak.linter.allScriptsDocumented = false

# This linter is not extensible for Unicode outside Mathlib's set.
weak.linter.unicodeLinter = false

# ============================================================
# DEPENDENCIES
# ============================================================
# Mathlib provides standard infrastructure used by this library.
# Mathlib release must match the Lean version in lean-toolchain.

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

# ============================================================
# PUBLIC LIBRARY
# ============================================================
# The library available for import. It must claim only the module
# family owned by this package. Other packages own other SE.* families.
#
# Do not claim the shared top-level module "SE".
# Multiple theory packages coexist in the same dependency graph,
# so each library must own only its namespaced family.
#
# Glob forms:
#   "A.B"    only module A.B
#   "A.B.*"  A.B and all its submodules
#   "A.B.+"  all submodules of A.B, but not A.B itself
#
# Use ".*" when the family has a root module.
# Use ".+" for a submodule directory that has no corresponding root .lean
# file when that family is listed separately.

[[lean_lib]]
name = "SE.Transformation"
roots = ["SE.Transformation"]
globs = ["SE.Transformation.*"]


# ============================================================
# TEST LIBRARY
# ============================================================
# Internal verification; not part of public import surface.

[[lean_lib]]
name = "SETest"
roots = ["SETest.Transformation"]
globs = ["SETest", "SETest.Transformation.*"]
leanOptions = { weak.linter.style.header = false }

# ============================================================
# LINT DRIVER
# ============================================================

[[lean_exe]]
name = "SELint"
root = "SELint"
leanOptions = { Elab.inServer = true }
