# ============================================================
# Composition Rules
# se-theory-transformation
# ============================================================
# Canonical currently declared composition pairs.
#
# Composition is ordered and explicitly partial. Only pairs for which
# composition? returns `some relation` appear here. Absence from this
# table means the theory currently specifies no canonical composition
# relation for that ordered pair; it does not mean the pair is invalid.
#
# CompositionRelation values:
#   absorbing                 - the second operator dominates, erases, or absorbs the first
#   composable                - the operator sequence is generally meaningful
#   conditionallyComposable   - the operator sequence is meaningful only under additional constraints
#   inverseLike               - the operators move in opposing directions but may not fully reverse
#   nonComposable             - the operator sequence is structurally invalid or incoherent
#   redundant                 - the second operator adds no relevant structural change
#
# Authority:
#   SE.Transformation.Reference.Composition

[meta]
source = "se-theory-transformation"
namespace = "se.transformation"
artifact = "composition-rules"
status = "canonical"

[composition.authorize_then_attest]
order = 1
id = "authorize_then_attest"
left = "AZ"
right = "AT"
relation = "composable"
lean_def = "authorizeThenAttest"
source_module = "SE.Transformation.Reference.Composition"
description = "Authorization followed by attestation is a canonical composable ordered pair."
note = "AZ and AT are also classified as orthogonal. Composition and orthogonality are independent axes."

[composition.bind_then_unbind]
order = 2
id = "bind_then_unbind"
left = "BD"
right = "UB"
relation = "inverseLike"
lean_def = "bindThenUnbind"
source_module = "SE.Transformation.Reference.Composition"
description = "Binding followed by unbinding is a canonical inverse-like ordered pair."


[composition.split_then_merge]
order = 3
id = "split_then_merge"
left = "SP"
right = "MG"
relation = "inverseLike"
lean_def = "splitThenMerge"
source_module = "SE.Transformation.Reference.Composition"
description = "Splitting followed by merging is a canonical inverse-like ordered pair."
