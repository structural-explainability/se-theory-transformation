# ============================================================
# Orthogonality Rules
# se-theory-transformation
# ============================================================
# Canonical currently declared orthogonality pairs.
#
# Orthogonality is explicitly partial and symmetric. Each unordered
# pair is represented once in this table. The Lean lookup itself
# contains both orientations and orthogonality_symm proves symmetry.
#
# Absence from this table means the theory currently specifies no
# canonical orthogonality relation for that pair.
#
# OrthogonalityRelation values:
#   conflicting  - operators cannot share a context without contradiction
#   dependent    - one operator's applicability depends on the other
#   orthogonal   - no shared effect domain; operators do not interfere
#   overlapping  - partial shared effect domain
#
# `inverseLike` is intentionally not an orthogonality value.
#
# Authority:
#   SE.Transformation.Reference.Orthogonality

[meta]
source = "se-theory-transformation"
namespace = "se.transformation"
artifact = "orthogonality-rules"
status = "canonical"

[orthogonality.authorize_and_attest]
order = 1
id = "authorize_and_attest"
left = "AZ"
right = "AT"
relation = "orthogonal"
lean_def = "authorizeAndAttest"
source_module = "SE.Transformation.Reference.Orthogonality"
note = "Authorization and attestation have canonically orthogonal effect domains."

[orthogonality.project_and_collapse]
order = 2
id = "project_and_collapse"
left = "PR"
right = "CL"
relation = "overlapping"
lean_def = "projectAndCollapse"
source_module = "SE.Transformation.Reference.Orthogonality"
note = "Projection and collapse have a canonical overlapping orthogonality relation."

[orthogonality.split_and_merge]
order = 3
id = "split_and_merge"
left = "SP"
right = "MG"
relation = "overlapping"
lean_def = "splitAndMerge"
source_module = "SE.Transformation.Reference.Orthogonality"
note = "Split and merge share structural effect dimensions and are also classified as an inverse-like ordered composition pair."
