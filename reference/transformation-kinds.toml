# ============================================================
# Transformation Kinds
# se-theory-transformation
# ============================================================
# Seven broad kinds providing the highest-level classification
# of transformation behavior. Kinds organize families.
#
# STATUS: canonical
# Kind identities match SE.Transformation.Domain.TransformationKind.
# Family memberships are the inverse of familyKind in
# SE.Transformation.Domain.Operator.Semantics.
#
# This file does not define persistence behavior.

[meta]
source = "se-theory-transformation"
namespace = "se.transformation"
artifact = "transformation-kinds"
version = "0.1.0"
status = "canonical"

[kind.Contextual]
order = 1
id = "Contextual"
label = "Contextual"
lean_constructor = "contextual"
source_module = "SE.Transformation.Domain.Kind.Contextual"
description = "Transformations that attach or remove bearer contexts, conditions, or dependencies."
family_ids = ["Contextual"]

[kind.Normative]
order = 2
id = "Normative"
label = "Normative"
lean_constructor = "normative"
source_module = "SE.Transformation.Domain.Kind.Normative"
description = "Transformations that apply permissions or authorizations to a referent and record the application as a fact."
family_ids = ["Normative"]

[kind.Observational]
order = 3
id = "Observational"
label = "Observational"
lean_constructor = "observational"
source_module = "SE.Transformation.Domain.Kind.Observational"
description = "Transformations that produce views, copies, or verified records of a referent without altering the referent itself."
family_ids = ["Attestation", "Projection", "Replication"]

[kind.Organizational]
order = 4
id = "Organizational"
label = "Organizational"
lean_constructor = "organizational"
source_module = "SE.Transformation.Domain.Kind.Organizational"
description = "Transformations that change structural arrangement or placement without altering referent content."
family_ids = ["Containment", "Reorganization"]

[kind.Relational]
order = 5
id = "Relational"
label = "Relational"
lean_constructor = "relational"
source_module = "SE.Transformation.Domain.Kind.Relational"
description = "Transformations that establish relationships between referents or relocate a referent while preserving referential linkage."
family_ids = ["Association", "Migration"]

[kind.Structural]
order = 6
id = "Structural"
label = "Structural"
lean_constructor = "structural"
source_module = "SE.Transformation.Domain.Kind.Structural"
description = "Transformations that combine, divide, or scale the structural complexity of a referent."
family_ids = ["Aggregation", "Decomposition", "Scaling"]

[kind.Temporal]
order = 7
id = "Temporal"
label = "Temporal"
lean_constructor = "temporal"
source_module = "SE.Transformation.Domain.Kind.Temporal"
description = "Transformations that produce versioned successors, divergent continuations, or reversions to prior states."
family_ids = ["Branching", "Versioning"]
