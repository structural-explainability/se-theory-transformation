# ============================================================
# Transformation Operators
# se-theory-transformation
# ============================================================
# Canonical operator catalog.
#
# Order matches SE.Transformation.referenceOperators.
# Labels match operatorCodeLabel.
# Families match operatorFamily.
# Kinds are derived transitively through familyKind.
#
# Lean is authoritative for all taxonomy mappings.
#
# Footprints match SE.Transformation.footprint.
# Requirements match SE.Transformation.requirements: each inner list is a
# clause, every clause must be satisfied, and a clause is satisfied when at
# least one of its dimensions changes.
# Lean is authoritative for footprints and requirements.

[meta]
source = "se-theory-transformation"
namespace = "se.transformation"
artifact = "transformation-operators"
status = "canonical"

[operator.AT]
order = 1
code = "AT"
label = "attest"
family = "attestation"
kind = "observational"
description = "Records a verified claim about a referent. Adds attestation metadata or evidence."
footprint = ["evidence"]
requirements = [["evidence"]]

[operator.AZ]
order = 2
code = "AZ"
label = "authorize"
family = "normative"
kind = "normative"
description = "Grants permission, authority, or normative standing to a subject or referent within a defined scope."
footprint = ["standing"]
requirements = [["standing"]]

[operator.BD]
order = 3
code = "BD"
label = "bind"
family = "contextual"
kind = "contextual"
description = "Associates a referent with a context, bearer, scope, or applicability setting."
footprint = ["binding"]
requirements = [["binding"]]

[operator.BR]
order = 4
code = "BR"
label = "branch"
family = "branching"
kind = "temporal"
description = "Creates a divergent continuation path from a referent, along which later changes may proceed independently of the original path."
footprint = ["lineage"]
requirements = [["lineage"]]

[operator.CL]
order = 5
code = "CL"
label = "collapse"
family = "scaling"
kind = "structural"
description = "Reduces structural scale or complexity by collapsing nested, redundant, or expanded structure."
footprint = ["content", "composition", "arrangement"]
requirements = [["composition", "arrangement"]]

[operator.CP]
order = 6
code = "CP"
label = "copy"
family = "replication"
kind = "observational"
description = "Produces a faithful duplicate of a referent or of a representation of a referent, identical to its source in content, arrangement, and composition and derived from it."
footprint = ["referentPopulation", "representationPopulation", "lineage"]
requirements = [["referentPopulation", "representationPopulation"], ["lineage"]]

[operator.EM]
order = 7
code = "EM"
label = "embed"
family = "containment"
kind = "organizational"
description = "Places a referent inside a containing structure, establishing containment."
footprint = ["containment"]
requirements = [["containment"]]

[operator.EX]
order = 8
code = "EX"
label = "expand"
family = "scaling"
kind = "structural"
description = "Increases structural scale, detail, or complexity by expanding a referent into a more elaborated form."
footprint = ["content", "composition", "arrangement"]
requirements = [["content", "composition", "arrangement"]]

[operator.LK]
order = 9
code = "LK"
label = "link"
family = "association"
kind = "relational"
description = "Establishes an association or relation between referents without implying containment."
footprint = ["association"]
requirements = [["association"]]

[operator.MG]
order = 10
code = "MG"
label = "merge"
family = "aggregation"
kind = "structural"
description = "Combines two or more referents or components into a single unified referent."
footprint = [
    "content",
    "arrangement",
    "composition",
    "referentPopulation",
    "representationPopulation",
    "containment",
    "binding",
    "association",
    "lineage",
    "evidence",
    "standing",
]
requirements = [["composition", "referentPopulation"]]

[operator.PR]
order = 11
code = "PR"
label = "project"
family = "projection"
kind = "observational"
description = "Derives a representation from a source referent without modifying the source. The representation may be partial or a selected form."
footprint = [
    "content",
    "arrangement",
    "composition",
    "representationPopulation",
    "lineage",
]
requirements = [["representationPopulation"], ["lineage"]]

[operator.RO]
order = 12
code = "RO"
label = "reorder"
family = "reorganization"
kind = "organizational"
description = "Changes the ordering or arrangement of a referent's components without changing which components it has."
footprint = ["arrangement"]
requirements = [["arrangement"]]

[operator.RV]
order = 13
code = "RV"
label = "revert"
family = "versioning"
kind = "temporal"
description = "Restores a referent to the state of a prior version along a version chain, moving its position in that chain."
footprint = [
    "content",
    "arrangement",
    "composition",
    "referentPopulation",
    "representationPopulation",
    "containment",
    "binding",
    "association",
    "lineage",
    "evidence",
    "standing",
]
requirements = [["lineage"]]

[operator.SH]
order = 14
code = "SH"
label = "shift"
family = "migration"
kind = "relational"
description = "Moves a referent from one relation, bearer, context, or structural position to another, leaving its other relations in place."
footprint = ["binding", "association", "containment", "arrangement"]
requirements = [["binding", "association", "containment", "arrangement"]]

[operator.SP]
order = 15
code = "SP"
label = "split"
family = "decomposition"
kind = "structural"
description = "Divides a referent into two or more constituent components, each of which may itself be a referent."
footprint = ["content", "arrangement", "composition", "referentPopulation"]
requirements = [["composition"]]

[operator.UB]
order = 16
code = "UB"
label = "unbind"
family = "contextual"
kind = "contextual"
description = "Removes, releases, or severs a contextual binding between a referent and its current context, bearer, or scope."
footprint = ["binding"]
requirements = [["binding"]]

[operator.VS]
order = 17
code = "VS"
label = "version"
family = "versioning"
kind = "temporal"
description = "Establishes a temporally ordered version or successor position for a referent and may materialize that version as a new referent or representation."
footprint = ["lineage", "referentPopulation", "representationPopulation"]
requirements = [["lineage"]]
