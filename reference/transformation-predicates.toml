# ============================================================
# Transformation Predicates
# se-theory-transformation
# ============================================================
# Public predicates derived from the authoritative taxonomy mappings.

schema = "se-predicate-registry-1"
kind = "predicate"
repo = "se-theory-transformation"
surface_module = "SE.Transformation"
namespace = "SE.Transformation"

[predicate.OperatorInFamily]
order = 1
id = "OperatorInFamily"
cite_id = "TR.DEF.OPERATOR_IN_FAMILY"
name = "Operator in family"
lean_symbol = "SE.Transformation.OperatorInFamily"
lean_kind = "def"
source_module = "SE.Transformation.Domain.Operator.Semantics"
description = "Predicate asserting that an operator's authoritative family equals the supplied transformation family."

[predicate.OperatorInKind]
order = 2
id = "OperatorInKind"
cite_id = "TR.DEF.OPERATOR_IN_KIND"
name = "Operator in kind"
lean_symbol = "SE.Transformation.OperatorInKind"
lean_kind = "def"
source_module = "SE.Transformation.Domain.Operator.Semantics"
description = "Predicate asserting that an operator's derived transformation kind equals the supplied kind."

[predicate.AgreementSuffices]
order = 3
id = "AgreementSuffices"
cite_id = "TR.DEF.AGREEMENT_SUFFICES"
name = "Agreement suffices"
lean_symbol = "SE.Transformation.StateModel.AgreementSuffices"
lean_kind = "def"
source_module = "SE.Transformation.Effect.Model"
description = "Agreement on every dimension in a set suffices for a relation between configurations."

[predicate.AgreementRequired]
order = 4
id = "AgreementRequired"
cite_id = "TR.DEF.AGREEMENT_REQUIRED"
name = "Agreement required"
lean_symbol = "SE.Transformation.StateModel.AgreementRequired"
lean_kind = "def"
source_module = "SE.Transformation.Effect.Model"
description = "A relation between configurations requires agreement on a dimension: whenever it holds, the configurations agree on that dimension."

[predicate.EffectsDisjoint]
order = 5
id = "EffectsDisjoint"
cite_id = "TR.DEF.EFFECTS_DISJOINT"
name = "Effects disjoint"
lean_symbol = "SE.Transformation.EffectsDisjoint"
lean_kind = "def"
source_module = "SE.Transformation.Effect.Orthogonality"
description = "The footprints of two operators share no dimension."

[predicate.EffectsOverlap]
order = 6
id = "EffectsOverlap"
cite_id = "TR.DEF.EFFECTS_OVERLAP"
name = "Effects overlap"
lean_symbol = "SE.Transformation.EffectsOverlap"
lean_kind = "def"
source_module = "SE.Transformation.Effect.Orthogonality"
description = "The footprints of two operators share at least one dimension."

[predicate.RestoresOn]
order = 7
id = "RestoresOn"
cite_id = "TR.DEF.RESTORES_ON"
name = "Restores on"
lean_symbol = "SE.Transformation.RestoresOn"
lean_kind = "def"
source_module = "SE.Transformation.Effect.Composition"
description = "Applying the second operator after the first returns every dimension in a set to its starting agreement."


[predicate.SequenceStep]
order = 8
id = "SequenceStep"
cite_id = "TR.DEF.SEQUENCE_STEP"
name = "Sequence step"
lean_symbol = "SE.Transformation.StateModel.SequenceStep"
lean_kind = "inductive"
source_module = "SE.Transformation.Effect.Sequence"
description = "A configuration is reached from another by applying a list of operators in order, each as one atomic step."
