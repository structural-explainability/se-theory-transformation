# ============================================================
# Transformation Theorems
# se-theory-transformation
# ============================================================
# Public semantic theorems for the transformation taxonomy and
# the currently declared partial composition and orthogonality relations.
#
# The membership theorems expose the relationship between the Prop-valued
# membership predicates and the authoritative taxonomy mappings.
#
# Internal finite taxonomy regression guards in
# SE.Transformation.Invariants are intentionally not registered here.

schema = "se-theorem-registry-1"
kind = "theorem"
repo = "se-theory-transformation"
surface_module = "SE.Transformation"
namespace = "SE.Transformation"

# ============================================================
# TAXONOMY MEMBERSHIP
# ============================================================

[theorem.OperatorInFamilyIff]
order = 1
id = "OperatorInFamilyIff"
cite_id = "TR.THM.OPERATOR_IN_FAMILY_IFF"
name = "Operator in family iff"
lean_symbol = "SE.Transformation.operatorInFamily_iff"
lean_kind = "theorem"
source_module = "SE.Transformation.Domain.Operator.Semantics"
description = "OperatorInFamily op family holds exactly when operatorFamily op equals family."

[theorem.OperatorInKindIff]
order = 2
id = "OperatorInKindIff"
cite_id = "TR.THM.OPERATOR_IN_KIND_IFF"
name = "Operator in kind iff"
lean_symbol = "SE.Transformation.operatorInKind_iff"
lean_kind = "theorem"
source_module = "SE.Transformation.Domain.Operator.Semantics"
description = "OperatorInKind op kind holds exactly when operatorKind op equals kind."

[theorem.OperatorInKindOfOperatorInFamily]
order = 3
id = "OperatorInKindOfOperatorInFamily"
cite_id = "TR.THM.OPERATOR_IN_KIND_OF_OPERATOR_IN_FAMILY"
name = "Operator in kind from operator in family"
lean_symbol = "SE.Transformation.operatorInKind_of_operatorInFamily"
lean_kind = "theorem"
source_module = "SE.Transformation.Domain.Operator.Semantics"
description = "An operator in a family is in any transformation kind assigned to that family."

