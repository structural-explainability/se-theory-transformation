# ============================================================
# Transformation Types
# se-theory-transformation
# ============================================================
# Public Lean type registry for the Transformation theory.
#
# The entries mirror retained public Lean types.

schema = "se-type-registry-1"
kind = "type"
repo = "se-theory-transformation"
surface_module = "SE.Transformation"
namespace = "SE.Transformation"

[type.OperatorCode]
order = 1
id = "OperatorCode"
cite_id = "TR.TYPE.OPERATOR_CODE"
name = "Operator code"
lean_symbol = "SE.Transformation.OperatorCode"
lean_kind = "inductive"
source_module = "SE.Transformation.Domain.Operator.Codes"
description = "Canonical two-letter code identifying a transformation operator."
constructors = [
    "AT",
    "AZ",
    "BD",
    "BR",
    "CL",
    "CP",
    "EM",
    "EX",
    "LK",
    "MG",
    "PR",
    "RO",
    "RV",
    "SH",
    "SP",
    "UB",
    "VS",
]

[type.TransformationFamily]
order = 2
id = "TransformationFamily"
cite_id = "TR.TYPE.TRANSFORMATION_FAMILY"
name = "Transformation family"
lean_symbol = "SE.Transformation.TransformationFamily"
lean_kind = "inductive"
source_module = "SE.Transformation.Domain.TransformationFamily"
description = "Mid-level behavioral category grouping transformation operators by shared structural behavior."
constructors = [
    "aggregation",
    "association",
    "attestation",
    "branching",
    "containment",
    "contextual",
    "decomposition",
    "migration",
    "normative",
    "projection",
    "replication",
    "reorganization",
    "scaling",
    "versioning",
]

[type.TransformationKind]
order = 3
id = "TransformationKind"
cite_id = "TR.TYPE.TRANSFORMATION_KIND"
name = "Transformation kind"
lean_symbol = "SE.Transformation.TransformationKind"
lean_kind = "inductive"
source_module = "SE.Transformation.Domain.TransformationKind"
description = "Broad behavioral category of transformation. Each transformation family belongs to exactly one transformation kind."
constructors = [
    "contextual",
    "normative",
    "observational",
    "organizational",
    "relational",
    "structural",
    "temporal",
]

[type.CompositionRelation]
order = 4
id = "CompositionRelation"
cite_id = "TR.TYPE.COMPOSITION_RELATION"
name = "Composition relation"
lean_symbol = "SE.Transformation.CompositionRelation"
lean_kind = "inductive"
source_module = "SE.Transformation.Relation.Composition"
description = "Classification of a specified sequencing relationship between two transformation operators."
constructors = [
    "absorbing",
    "composable",
    "conditionallyComposable",
    "inverseLike",
    "nonComposable",
    "redundant",
]

[type.OrthogonalityRelation]
order = 5
id = "OrthogonalityRelation"
cite_id = "TR.TYPE.ORTHOGONALITY_RELATION"
name = "Orthogonality relation"
lean_symbol = "SE.Transformation.OrthogonalityRelation"
lean_kind = "inductive"
source_module = "SE.Transformation.Relation.Orthogonality"
description = "Classification of a specified structural-independence relationship between two transformation operators."
constructors = [
    "conflicting",
    "dependent",
    "orthogonal",
    "overlapping",
]
